name: ZGTASA
options:
  deploymentTarget:
    iOS: '16.0'
  xcodeVersion: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.10'
    IPHONEOS_DEPLOYMENT_TARGET: '16.0'
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  ZGTASA:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: ../native-installer/swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zema.zgtasa
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ''
        CLANG_ENABLE_MODULES: YES
        SWIFT_INCLUDE_PATHS:
          - $(inherited)
          - $(SRCROOT)/../native-physics/include
          - $(SRCROOT)/../native-samp/include
          - $(SRCROOT)/../native-installer/include
        LIBRARY_SEARCH_PATHS[sdk=iphoneos*]:
          - $(inherited)
          - $(SRCROOT)/../local-only/native-physics/ios-device
          - $(SRCROOT)/../local-only/native-samp/ios-device
          - $(SRCROOT)/../local-only/native-installer/device
        LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]:
          - $(inherited)
          - $(SRCROOT)/../local-only/native-physics/ios-simulator
          - $(SRCROOT)/../local-only/native-samp/ios-simulator
          - $(SRCROOT)/../local-only/native-installer/simulator
        OTHER_LDFLAGS:
          - $(inherited)
          - -lzgtasa_native_physics
          - -lzgtasa_samp
          - -lzgtasa_installer
          - -lz
          - -lresolv
    dependencies:
      - sdk: Security.framework
      - sdk: CoreFoundation.framework
schemes:
  ZGTASA:
    build:
      targets:
        ZGTASA: all
    run:
      config: Release
    profile:
      config: Release
