name: ZGTASA
options:
  deploymentTarget:
    iOS: '16.0'
  xcodeVersion: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.10'
    IPHONEOS_DEPLOYMENT_TARGET: '16.0'
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  ZGTASA:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zema.zgtasa
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ''
        CLANG_ENABLE_MODULES: YES
        SWIFT_INCLUDE_PATHS:
          - $(inherited)
          - $(SRCROOT)/../native-physics/include
        LIBRARY_SEARCH_PATHS[sdk=iphoneos*]:
          - $(inherited)
          - $(SRCROOT)/../local-only/native-physics/ios-device
        LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]:
          - $(inherited)
          - $(SRCROOT)/../local-only/native-physics/ios-simulator
        OTHER_LDFLAGS:
          - $(inherited)
          - -lzgtasa_native_physics
    dependencies:
      - sdk: Security.framework
      - sdk: CoreFoundation.framework
