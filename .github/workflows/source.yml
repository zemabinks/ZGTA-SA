name: Source and hosting checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 check_public_source.py
      - run: python3 smoke_public_source.py
      - run: python3 smoke_de_menu_import.py
      - run: python3 smoke_native_project.py
      - run: python3 smoke_host.py
      - run: node smoke_discord.js
      - run: node smoke_inventory_ack.js
      - run: node smoke_weapon_transport.js
      - run: node smoke_weapon_frame_batches.js
      - run: node smoke_health_ack.js
      - run: node smoke_native_terminal_vehicle.js
      - run: node smoke_native_skin_network_child.js
      - run: node smoke_browser_armour_sync.js
      - run: node smoke_native_melee_server.js
      - run: node smoke_native_melee_assets.js
      - run: node smoke_native_working_assets.js
      - run: node smoke_vehicle_coupling_server.js
      - run: node smoke_radio_import_bounds.js
      - run: node smoke_radio_development.js
      - run: node smoke_selfhost_tp_units.js
      - run: node smoke_selfhost_position_resume.js
      - run: node smoke_selfhost_mission_persistence.js
  native-foundation:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 smoke_core_115.py
