[package]
name = "zgtasa_native_physics"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[features]
# Original compat WASM has no SIMD variant enabled. Controlled native
# aircraft/boat replay matches its trajectories with scalar glam math.
default = ["wasm-scalar-math"]
wasm-scalar-math = ["glam/scalar-math"]

[dependencies]
glam = { version = "=0.33.3", default-features = false }
# Archive WASM is byte-identical to @dimforge/rapier3d-compat 0.20.0.
# Its official npm gitHead builds the in-repo Rapier core 0.35.1.
rapier3d = { git = "https://github.com/dimforge/rapier", rev = "3e12c2679cb1940a876bde93af9cec0cf2f57944" }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "debuginfo"
